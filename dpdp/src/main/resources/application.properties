spring.application.name=dpdp

# ── Database ─────────────────────────────────────────────────────────────────
# Local default: H2 file-based DB (no install needed for local dev).
# In Docker Compose, these are overridden by environment variables to use PostgreSQL.
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:file:./data/dpdp_db}
spring.datasource.driver-class-name=${SPRING_DATASOURCE_DRIVER_CLASS_NAME:org.h2.Driver}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}

# ── JPA / Hibernate ────────────────────────────────────────────────────────
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.database-platform=${SPRING_JPA_DATABASE_PLATFORM:org.hibernate.dialect.H2Dialect}

# ── H2 Console (dev convenience — disable behind a firewall in prod) ───────
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# ── JWT ──────────────────────────────────────────────────────────────────────
# The default value is a local-dev placeholder ONLY. Set JWT_SECRET in .env
# for any real deployment. Must be a base64-encoded ≥256-bit key.
#
# Generate with:
#   python -c "import base64,os; print(base64.b64encode(os.urandom(32)).decode())"
#
jwt.secret=${JWT_SECRET:dGhpcy1pcy1hLXZlcnktc2VjdXJlLWp3dC1zZWNyZXQta2V5LWZvci1kcGRwLWFwcGxpY2F0aW9u}
jwt.expiration-ms=86400000

# ── AI Service URL ────────────────────────────────────────────────────────────
# Local dev default: localhost. In Docker Compose, set AI_SERVICE_URL=http://ai-service:5000
ai.service.url=${AI_SERVICE_URL:http://localhost:5000}
