version: '3.8'
services:
  # Python AI Service
  ai-service:
    build: ./ai-service
    ports:
      - "5000:5000"
    environment:
      - GROQ_API_KEY=${GROQ_API_KEY}

  # Redis Cache (Required by AI and Java)
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  # Java Backend
  backend:
    build: ./dpdp
    ports:
      - "8080:8080"
    depends_on:
      - redis